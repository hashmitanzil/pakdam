name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # NOTE: plain `pnpm install` until pnpm-lock.yaml is committed; then
      # switch this to `pnpm install --frozen-lockfile`.
      - name: Install dependencies
        run: pnpm install

      - name: Typecheck (all workspaces)
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_WORKER_URL: ""
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_OLA_MAPS_API_KEY: placeholder
