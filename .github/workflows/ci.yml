name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # pnpm-lock.yaml IS committed — install frozen so CI fails loudly
      # when package.json and the lockfile drift apart, instead of
      # silently resolving a different tree.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Playwright browsers for the web e2e suite (root `pnpm test` runs
      # it via `pakdam-web test:e2e`; Chromium cannot launch in the
      # sandbox VM, so the e2e leg is CI-only until a local runner exists).
      - name: Install Playwright browsers
        run: pnpm --filter pakdam-web exec playwright install --with-deps chromium

      # Production build BEFORE the tests: the e2e leg runs against the
      # production server (`next start`, see apps/web/playwright.config.ts)
      # because Next.js dev mode eval()s for source maps and violates the
      # app's CSP (no 'unsafe-eval'), which flooded every page with page
      # errors. The build must exist before `pnpm test` starts the e2e leg.
      # NEXT_PUBLIC_* values are baked into the client bundle at build
      # time: WORKER_URL "" keeps the build in demo mode for the demo
      # specs, and NO Ola key is set on purpose — a baked placeholder key
      # would make the app treat Ola as configured and the no-key map
      # specs (the CI default) would fail instead of showing the
      # missing-key banner.
      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_WORKER_URL: ""
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      # Runs the real test suite and FAILS if any workspace has no test
      # script or no tests — `pnpm -r run test` used to exit 0 with zero
      # tests executed, which hid the gap. See root package.json `test`.
      - name: Unit tests
        run: pnpm test
