# Pakdam Worker — live game server (fresh build)
#
# Worker name: pakdam. One Durable Object per room (ROOM_DO) plus a single
# code-registry Durable Object (CODE_REGISTRY_DO) that owns invite-code ->
# roomId mappings. The registry exists because a code lookup must work from
# ANY isolate: a per-isolate Worker map (or a map held inside one room's DO)
# cannot answer "which room owns this code". The registry DO is the single
# owner of that mapping, the same single-owner lesson as the WS ticket
# registry (see src/room-do.ts).
#
# SUPABASE_URL lives HERE, in [vars], on purpose. The old deployment kept
# losing it when it lived only as a secret / --var value: a plain
# `wrangler deploy` overwrote it and match results silently stopped
# persisting. The project URL is public (it is also the web app's
# NEXT_PUBLIC_SUPABASE_URL). Only the service-role KEY stays a secret:
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# Never put the key in this file.

name = "pakdam"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
usage_model = "standard"

[[durable_objects.bindings]]
name = "ROOM_DO"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "CODE_REGISTRY_DO"
class_name = "CodeRegistryDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "CodeRegistryDO"]

[vars]
SUPABASE_URL = "https://gcgakeslhfmilicokdtp.supabase.co"
# ALLOWED_ORIGINS is optional (comma-separated). When unset, the Worker
# allows the production Vercel origin plus localhost dev (see src/index.ts).
# SUPABASE_SERVICE_ROLE_KEY is a SECRET, set via:
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
